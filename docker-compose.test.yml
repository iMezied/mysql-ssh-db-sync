# Integration test fixtures.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   cargo test --workspace -- --include-ignored
#   docker compose -f docker-compose.test.yml down -v
#
# Ports are deliberately non-default so a developer's local MySQL/Postgres is
# never touched by a test run.

# Pinned, because everything that talks to these containers addresses them by
# name — `db-sync-postgres-1` and friends appear in two shell scripts and ten
# places across the integration suites. Compose otherwise takes the project
# name from the directory it is run in, which is `db-sync` on a machine that
# cloned into that folder and `mysql-ssh-db-sync` on CI, where the checkout is
# named after the repository. Every one of those names was therefore correct
# locally and wrong in CI, which is why the fixture verification reported 22
# checks failing with an empty result and no reason: `docker exec` was being
# handed a container that did not exist.
name: db-sync

services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: fixture
      MYSQL_USER: dbsync
      MYSQL_PASSWORD: testpass
    ports:
      - "13306:3306"
    volumes:
      - ./tests/fixtures/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestroot"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    # Matched to the pg_dump major version the host provides. A newer pg_dump
    # emits directives an older server rejects on restore — pg_dump 18 against
    # a 16 server produces `SET transaction_timeout = 0`, which 16 does not
    # recognise. Matching versions is what the app recommends, so it is what
    # the fixture exercises. The mismatch cases are covered by unit tests on
    # check_pg_dump_compatibility.
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_USER: dbsync
      POSTGRES_DB: fixture
    ports:
      - "15432:5432"
    volumes:
      - ./tests/fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbsync -d fixture"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Deliberately a standalone, not a replica set.
  #
  # It is what most development databases are, and it is the configuration
  # `--oplog` cannot run against — so leaving oplog capture off by default is
  # exercised here rather than assumed. A replica set would hide that.
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: testroot
      MONGO_INITDB_DATABASE: fixture
    ports:
      - "27018:27017"
    volumes:
      - ./tests/fixtures/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `ping` is one of the few commands a server with authentication enabled
      # answers before a login, so this needs no credentials.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # S3-compatible object storage for the off-site destination tests.
  #
  # MinIO speaks the same protocol as S3, R2, B2 and Wasabi, so it exercises
  # signing, path-style addressing and multipart for real. It is not a
  # substitute for testing against AWS itself — see engine/src/s3/mod.rs.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dbsynctest
      MINIO_ROOT_PASSWORD: dbsynctestsecret
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Exercises the tunnel path end to end. The database containers are reachable
  # from here by service name, so a test can forward to mysql:3306 through SSH
  # exactly as a real deployment would.
  sshd:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: tunnel
      PASSWORD_ACCESS: "false"
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - "12222:2222"
    volumes:
      - ./tests/fixtures/ssh:/keys:ro
      # Raises MaxStartups/MaxSessions so concurrent tunnels in the test suites
      # are not randomly dropped by sshd. See the script for why.
      - ./tests/fixtures/sshd-init:/custom-cont-init.d:ro
