<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    macOS menu-bar icon.

    A *template* image: macOS ignores the colour and uses only the alpha
    channel, tinting it for a light or dark menu bar and inverting it while the
    menu is open. Everything outside the glyph must therefore be genuinely
    transparent — an opaque background makes the whole square tint solid and the
    menu bar shows a filled block instead of a glyph.

    Drawn without the app icon's tile: at 16pt a tile plus glyph becomes mud.
    The slots are cut, not painted, for the same reason as the app icon.

    Regenerate with a rasteriser that preserves alpha (NOT qlmanage):

        rsvg-convert -w 44 -h 44 tray-template.svg -o ../tray-template.png
        rsvg-convert -w 88 -h 88 tray-template.svg -o ../tray-template@2x.png
  -->
  <defs>
    <mask id="glyph">
      <g fill="#ffffff"><path d="M 212 250 a 300 88 0 0 1 600 0 v 450 a 300 88 0 0 1 -600 0 z"/><ellipse cx="512" cy="250" rx="300" ry="88"/></g>
      <g fill="#000000"><path d="M 212 386 a 300 88 0 0 0 600 0 v 46 a 300 88 0 0 1 -600 0 z"/><path d="M 212 524 a 300 88 0 0 0 600 0 v 46 a 300 88 0 0 1 -600 0 z"/></g>
    </mask>
  </defs>

  <g mask="url(#glyph)">
    <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>
  </g>
</svg>
