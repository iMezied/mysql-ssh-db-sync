<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Master application icon.

    Geometry follows Apple's icon grid: a 1024 canvas with the artwork on an
    824 body, so the bundled icon lines up with every other tile in the Dock.
    The body is a superellipse rather than a rounded rectangle because that is
    the shape macOS actually uses; a circular-arc `rx` reads visibly rounder
    next to real system icons.

    The platter divisions are cut out of the disc as negative space, letting the
    tile gradient through, rather than painted on as translucent grey. Grey on
    white loses its contrast the moment the icon is scaled down and turns the
    glyph into a smudge at 16px.

    DO NOT regenerate the PNGs with `qlmanage`. It composites onto an opaque
    white background, which yields a white square around the icon and — for the
    menu-bar template, where macOS reads only the alpha channel — a solid
    filled block. Use a real rasteriser:

        rsvg-convert -w 1024 -h 1024 icon.svg -o icon.png   # brew install librsvg

    then regenerate every platform size:

        npm run tauri icon src-tauri/icons/source/icon.png
  -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5773ea"/>
      <stop offset="0.52" stop-color="#2f45c5"/>
      <stop offset="1" stop-color="#1a2470"/>
    </linearGradient>

    <linearGradient id="face" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edfa"/>
    </linearGradient>

    <!-- Top-edge light, as every other tile icon in the Dock carries. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="disc">
      <g fill="#ffffff"><path d="M 287 360 a 225 66 0 0 1 450 0 v 304 a 225 66 0 0 1 -450 0 z"/><ellipse cx="512" cy="360" rx="225" ry="66"/></g>
      <g fill="#000000"><path d="M 287 462 a 225 66 0 0 0 450 0 v 34 a 225 66 0 0 1 -450 0 z"/><path d="M 287 566 a 225 66 0 0 0 450 0 v 34 a 225 66 0 0 1 -450 0 z"/></g>
    </mask>
  </defs>

