[package]
name = "db-sync-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "db_sync_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
db-sync-engine = { path = "../../../engine" }
# `tray-icon` is what lets the app keep running — and keep firing schedules —
# after its window is closed. `image-png` decodes the menu-bar template icon.
tauri = { version = "2", features = ["specta", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
secrecy.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

# Keep target-specific sections LAST. A `[target.'cfg(...)'.dependencies]`
# header captures every key that follows it, so one placed mid-file silently
# makes the rest of the dependency list conditional — and the build only
# breaks on the platform that was excluded, which is never the one in front of
# you. This bit the engine crate once already; see DECISIONS.md.
[dev-dependencies]
tempfile = "3"
# The mock runtime, so commands can be driven through the real IPC path
# without a window. See tests/ipc.rs.
tauri = { version = "2", features = ["test"] }
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# `access(2)` is the honest way to ask whether a directory is writable; working
# it out from ownership and group membership gets it wrong for ACLs.
libc = "0.2"
