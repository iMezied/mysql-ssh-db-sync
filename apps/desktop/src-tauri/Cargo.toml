[package]
name = "db-sync-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "db_sync_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
db-sync-engine = { path = "../../../engine" }
# `tray-icon` is what lets the app keep running — and keep firing schedules —
# after its window is closed. Without it, closing the window would silently
# stop every backup the user configured.
tauri = { version = "2", features = ["specta", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
