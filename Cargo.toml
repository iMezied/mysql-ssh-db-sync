[workspace]
resolver = "2"
members = [
    "engine",
    "engine-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
secrecy = { version = "0.10", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    # Introspection and verification queries. Bulk dump/restore still goes
    # through the vendor tools; these drivers are for reading catalogs and
    # counting rows.
    "mysql",
    "postgres",
] }
# NOTE: keyring is NOT declared here. Its backend is selected by feature flags,
# and with default features it silently falls back to an in-memory *mock* store
# — secrets appear to save and then vanish. It is declared per-target in
# engine/Cargo.toml so the native backend is always enabled. See DECISIONS.md.
# MongoDB catalog access. Same role sqlx plays for the relational engines:
# reading the catalog, counting documents and masking. Bulk dump and restore
# still go through `mongodump`/`mongorestore`.
#
# `default-features = false` drops `dns-resolver`, which exists to follow
# `mongodb+srv://` TXT/SRV records. Every connection this app makes is to an
# explicit host and port — usually a tunnel's local end — so SRV lookup could
# never fire, and hickory-resolver is a large dependency to sign and notarise
# for a code path that cannot run. `rustls-tls` is kept, matching the choice
# made for reqwest: no OpenSSL in the bundle.
mongodb = { version = "3.8", default-features = false, features = [
    "compat-3-0-0",
    "rustls-tls",
] }
async-trait = "0.1"
sha2 = "0.10"
# SigV4 request signing. Paired with sha2 0.10 — the versions must match,
# because hmac takes its digest implementation from it.
hmac = "0.12"
flate2 = "1"

# Webhook delivery only. `default-features = false` keeps OpenSSL out of the
# build: the `rustls` feature verifies certificates against the OS trust store
# via rustls-platform-verifier, so a corporate webhook endpoint behind an
# internal CA still works without shipping our own root bundle.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "charset",
] }

# Pinned exactly: these are release candidates and rc-to-rc churn breaks builds.
# specta-typescript is a DIRECT dependency because tauri-specta's `export`
# takes an `impl LanguageExt`, and the only impls live on specta_typescript types.
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid", "serde_json"] }
specta-typescript = { version = "=0.0.12" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# SSH tunnels land in M1'. Pinned here so the version is a deliberate choice
# rather than whatever resolves on the day.
# russh = "0.62"
