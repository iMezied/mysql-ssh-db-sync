name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webview and its dependencies.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit tests only here; the container-backed integration suites need
      # Docker and run in the `fixtures` job.
      - name: Test
        run: cargo test --workspace --lib --bins

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Node 22 ships npm 10, and package-lock.json was written by npm 11.
      # That is not a cosmetic difference: vitest 4 asks for
      # `vite: ^6 || ^7 || ^8`, npm 11 resolves it to vite 8 — which builds on
      # rolldown and pulls no esbuild at all — and npm 10 resolves the same
      # range to a vite that wants esbuild 0.28.2, finds no entry for it, and
      # refuses the whole install with EUSAGE. The lockfile is not stale; it is
      # simply an npm 11 lockfile, so the tool that reads it has to be npm 11.
      #
      # Pinned to the major rather than bumping node, so the runtime the tests
      # execute under stays the one they are developed against.
      - run: npm install -g npm@11

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci
        working-directory: apps/desktop

      # bindings.ts is generated from the Rust command signatures. Regenerating
      # here means a Rust change that breaks the frontend fails the build
      # instead of surfacing at runtime.
      - name: Regenerate TypeScript bindings
        run: cargo test -p db-sync-desktop --lib export_typescript_bindings

      - name: Fail if bindings are stale
        run: git diff --exit-code apps/desktop/src/bindings.ts

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/desktop

      # `lib/tableSelection.ts` decides what a backup actually contains. A
      # regression there still succeeds, still writes an artifact and still
      # reports green — the loss only surfaces when someone needs the data.
      - name: Test
        run: npm test
        working-directory: apps/desktop

      - name: Build
        run: npm run build
        working-directory: apps/desktop

  fixtures:
    name: Database fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate the test SSH key
        run: |
          mkdir -p tests/fixtures/ssh
          ssh-keygen -t ed25519 -N "" -C dbsync-test -f tests/fixtures/ssh/id_ed25519
          chmod 600 tests/fixtures/ssh/id_ed25519

      - name: Start MySQL, PostgreSQL and sshd
        run: docker compose -f docker-compose.test.yml up -d --wait

      # The engine shells out to these; they are never bundled (GPL applies to
      # mysqldump — see DECISIONS.md), so CI installs them as a user would.
      #
      # PostgreSQL comes from PGDG, not from Ubuntu. `pg_dump` refuses outright
      # to read a server newer than itself, and Ubuntu ships a client several
      # majors behind the `postgres:18` fixture — so the distribution package
      # would block every PostgreSQL round-trip test.
      #
      # gnome-keyring provides the Secret Service the engine stores database
      # passwords in. Without it the credential-touching suites cannot run at
      # all, which is what kept them out of CI until now.
      #
      # `dbus-x11` is the daemon that Secret Service is spoken to over; the
      # `-dev` package and `pkg-config` are what `libdbus-sys` needs to build
      # against it. Installing only the first is why this job never got as far
      # as running a fixture: `cargo build -p db-sync-cli` panicked in that
      # crate's build script, which reports a missing `dbus-1.pc` and exits 101.
      - name: Install database client tools and a credential store
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client gnome-keyring dbus-x11 \
            libdbus-1-dev pkg-config

          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

          # Installing the 18 client does not make it the one that runs. The
          # runner image ships PostgreSQL 16 and its binary owns
          # /usr/bin/pg_dump, so `pg_dump` stayed 16.14 and every PostgreSQL
          # round-trip died on "pg_dump 16.14.0 is older than the server
          # (18.6.0)" — the engine refusing correctly, against a client this
          # step went to some trouble to replace. PGDG keeps each major in its
          # own directory; 18's goes first.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"

          # Checked here rather than discovered in a round-trip test several
          # minutes later, where it reads as a backup bug.
          pg_dump --version
          mysqldump --version
          pg_dump --version | grep -qE ' 18\.' || {
            echo "expected pg_dump 18, got: $(pg_dump --version)" >&2
            exit 1
          }

      - name: Build CLI
        run: cargo build -p db-sync-cli

      - name: Verify fixture contents
        run: tests/verify-fixtures.sh

      # Proves DEFINER stripping against a real mysqldump: the raw dump must be
      # rejected without SUPER, the stripped one must restore, and row data
      # containing the literal text "DEFINER=" must survive untouched.
      - name: Verify DEFINER round-trip
        run: tests/verify-definer-roundtrip.sh

      # `--include-ignored` is the point of this step: the suites that dump,
      # restore, verify and run schedules against real servers are `#[ignore]`d
      # because they need a credential store, and until now that meant they
      # never ran anywhere.
      #
      # The keyring password must be NON-EMPTY. An empty one leaves
      # gnome-keyring without a default collection, and every secret write
      # fails with `NoStorageAccess` — which reads like a permissions problem
      # and is not. Verified in an ubuntu:24.04 container before committing.
      #
      # Scoped to the two crates that talk to databases. The desktop crate is
      # built and tested in the `rust` job, which installs the GTK and webview
      # development packages; pulling those in here purely to compile a crate
      # this job does not exercise would add minutes for nothing.
      - name: Integration suites (tunnel, introspection, end-to-end, schedules)
        run: |
          dbus-run-session -- bash -c '
            echo -n "dbsync-ci" | gnome-keyring-daemon --unlock > /dev/null
            cargo test -p db-sync-engine -p db-sync-cli -- --include-ignored
          '
        env:
          # Turn a "containers not running" skip into a failure, so a broken
          # harness cannot look like a green build forever.
          DBSYNC_REQUIRE_CONTAINERS: "1"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
