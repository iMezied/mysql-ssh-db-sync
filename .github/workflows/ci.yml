name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webview and its dependencies.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit tests only here; the container-backed integration suites need
      # Docker and run in the `fixtures` job.
      - name: Test
        run: cargo test --workspace --lib --bins

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci
        working-directory: apps/desktop

      # bindings.ts is generated from the Rust command signatures. Regenerating
      # here means a Rust change that breaks the frontend fails the build
      # instead of surfacing at runtime.
      - name: Regenerate TypeScript bindings
        run: cargo test -p db-sync-desktop --lib export_typescript_bindings

      - name: Fail if bindings are stale
        run: git diff --exit-code apps/desktop/src/bindings.ts

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/desktop

      - name: Build
        run: npm run build
        working-directory: apps/desktop

  fixtures:
    name: Database fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate the test SSH key
        run: |
          mkdir -p tests/fixtures/ssh
          ssh-keygen -t ed25519 -N "" -C dbsync-test -f tests/fixtures/ssh/id_ed25519
          chmod 600 tests/fixtures/ssh/id_ed25519

      - name: Start MySQL, PostgreSQL and sshd
        run: docker compose -f docker-compose.test.yml up -d --wait

      # The engine shells out to these; they are never bundled (GPL — see
      # DECISIONS.md), so CI installs them the same way a user would.
      - name: Install MySQL client tools
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Build CLI
        run: cargo build -p db-sync-cli

      - name: Verify fixture contents
        run: tests/verify-fixtures.sh

      # Proves DEFINER stripping against a real mysqldump: the raw dump must be
      # rejected without SUPER, the stripped one must restore, and row data
      # containing the literal text "DEFINER=" must survive untouched.
      - name: Verify DEFINER round-trip
        run: tests/verify-definer-roundtrip.sh

      - name: Integration suites (tunnel, introspection, end-to-end)
        run: cargo test --workspace
        env:
          # Turn a "containers not running" skip into a failure, so a broken
          # harness cannot look like a green build forever.
          DBSYNC_REQUIRE_CONTAINERS: "1"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
